<section id="skills" class="py-20 px-4 bg-slate-100/50 dark:bg-slate-900/40">
    <div class="max-w-7xl mx-auto">
        <div class="transition-all duration-1000 opacity-100 translate-y-0">
            <app-section-title [beforeGradient]="t().skills.title" [gradientText]="t().skills.titleHighlight"></app-section-title>
            <div class="flex flex-wrap justify-center gap-8">
                @for (skill of skills(); track skill; let i = $index) {
                <div appScrollReveal animationClass="scale-in" [delay]="i * 80">
                    <app-skill-card [skills]="skill"></app-skill-card>
                </div>
                }
            </div>
        </div>
    </div>
</section>
