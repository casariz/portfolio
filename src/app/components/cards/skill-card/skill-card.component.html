<div
    class="card-glass p-6 rounded-xl shadow-lg card-hover transition-all duration-300 h-full min-h-[320px] w-full max-w-md">
    <div class="flex items-center gap-3 mb-6">
        <div class="icon-container">
            <div class="icon-color">
                <lucide-angular [img]="skills.icon" class="w-6 h-6"></lucide-angular>
            </div>
        </div>
        <h3 class="text-xl font-bold text-slate-800 dark:text-white">{{skills.title}}</h3>
    </div>
    <div class="grid grid-cols-3 gap-4">
        @for (skill of skills.skills; track skill) {
        <div class="flex items-center justify-center p-3 bg-slate-100/50 dark:bg-slate-700/30 rounded-xl hover:bg-slate-200/60 dark:hover:bg-slate-700/50 transition-all duration-200 group cursor-pointer"
             [title]="skill.name">
            <app-simple-icon [name]="skill.icon" class="w-8 h-8 grayscale group-hover:grayscale-0 group-hover:scale-110 transition-all duration-200"></app-simple-icon>
        </div>
        }
    </div>

</div>
